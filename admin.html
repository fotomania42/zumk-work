<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>예약 현황 관리 | zumk.work</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/config.js"></script>
</head>
<body class="bg-slate-50 text-neutral-800 dark:bg-neutral-950 dark:text-neutral-300 min-h-screen flex items-center justify-center px-5 py-12">

    <button id="theme-toggle" type="button" aria-label="라이트/다크 모드 전환" class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-white/70 dark:bg-neutral-800/70 border border-white/50 dark:border-neutral-700/50 shadow-xl flex items-center justify-center">
        <i class="ri-sun-line hidden dark:block text-xl text-yellow-400"></i>
        <i class="ri-moon-clear-line dark:hidden text-xl text-brand-600"></i>
    </button>

    <main class="w-full max-w-md">
        <div class="flex items-center justify-between mb-6">
            <a href="index.html" class="text-xl font-bold tracking-tighter text-neutral-900 dark:text-white">zumk.work</a>
            <span class="text-xs font-semibold text-neutral-500">관리</span>
        </div>

        <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-3xl shadow-xl p-7">
            <h1 class="text-xl font-bold text-neutral-900 dark:text-white mb-1">예약 현황</h1>
            <p id="month-label" class="text-sm text-neutral-500 mb-6"></p>

            <!-- 현재 상태 -->
            <div id="current" class="rounded-2xl p-5 mb-6 border border-neutral-200 dark:border-neutral-800 bg-slate-50 dark:bg-neutral-950">
                <p class="text-xs text-neutral-500 mb-2">지금 사이트에 보이는 문구</p>
                <p id="current-text" class="status-badge text-base font-bold text-neutral-900 dark:text-white" data-state="loading"><span class="status-dot"></span><span>불러오는 중</span></p>
                <p id="updated-at" class="text-xs text-neutral-500 mt-2"></p>
            </div>

            <!-- 설정 안 됨 -->
            <div id="setup-needed" class="hidden rounded-2xl p-5 bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 text-sm text-amber-900 dark:text-amber-200 leading-relaxed">
                아직 Firebase 설정이 비어 있어요. <code class="font-mono text-xs">assets/config.js</code>의 <code class="font-mono text-xs">firebase</code>와 <code class="font-mono text-xs">adminEmail</code>을 채운 뒤 다시 열어 주세요. 순서는 ADMIN_SETUP.md에 정리되어 있습니다.
            </div>

            <!-- 로그인 전 -->
            <div id="signed-out" class="hidden">
                <button id="login" type="button" class="w-full flex items-center justify-center gap-2 bg-neutral-900 text-white dark:bg-white dark:text-black py-3.5 rounded-2xl font-bold hover:opacity-90 transition">
                    <i class="ri-google-fill"></i>Google 계정으로 로그인
                </button>
            </div>

            <!-- 로그인 후 -->
            <div id="signed-in" class="hidden">
                <div class="grid grid-cols-1 gap-3">
                    <button id="set-open" type="button" class="w-full flex items-center justify-center gap-2 py-4 rounded-2xl font-bold border-2 transition border-emerald-500 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-50 dark:hover:bg-emerald-500/10">
                        <i class="ri-checkbox-circle-line text-lg"></i>예약 받기
                    </button>
                    <button id="set-closed" type="button" class="w-full flex items-center justify-center gap-2 py-4 rounded-2xl font-bold border-2 transition border-orange-500 text-orange-700 dark:text-orange-300 hover:bg-orange-50 dark:hover:bg-orange-500/10">
                        <i class="ri-close-circle-line text-lg"></i>이번 달 예약 마감
                    </button>
                </div>
                <p class="text-xs text-neutral-500 mt-4 leading-relaxed">마감은 이번 달에만 적용돼요. 다음 달 1일 0시(한국 시간)가 되면 따로 누르지 않아도 사이트가 자동으로 "예약 가능"으로 바뀝니다.</p>
                <div class="flex items-center justify-between mt-6 pt-4 border-t border-neutral-200 dark:border-neutral-800 text-xs text-neutral-500">
                    <span id="who"></span>
                    <button id="logout" type="button" class="font-semibold hover:text-neutral-900 dark:hover:text-white">로그아웃</button>
                </div>
            </div>

            <p id="message" class="hidden mt-4 text-sm rounded-xl px-4 py-3" role="alert"></p>
        </div>
    </main>

    <script src="assets/site.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        const Z = window.ZUMK;
        const $ = (id) => document.getElementById(id);
        const now = Z.kstMonth();
        $('month-label').textContent = `${now.y}년 ${now.m}월 기준 (한국 시간)`;

        function showMessage(text, ok) {
            const m = $('message');
            m.textContent = text;
            m.className = 'mt-4 text-sm rounded-xl px-4 py-3 ' + (ok
                ? 'bg-emerald-50 text-emerald-800 dark:bg-emerald-500/10 dark:text-emerald-200'
                : 'bg-red-50 text-red-800 dark:bg-red-500/10 dark:text-red-200');
        }

        function renderCurrent(data) {
            const info = Z.resolveBooking(data);
            const el = $('current-text');
            el.setAttribute('data-state', info.closed ? 'closed' : 'open');
            el.lastChild.textContent = info.closed
                ? `${info.month}월 예약 마감 · ${info.next}월 1일부터 다시 받아요`
                : '지금 예약을 받고 있어요';
            $('set-open').classList.toggle('bg-emerald-50', !info.closed);
            $('set-open').classList.toggle('dark:bg-emerald-500/10', !info.closed);
            $('set-closed').classList.toggle('bg-orange-50', info.closed);
            $('set-closed').classList.toggle('dark:bg-orange-500/10', info.closed);
            const ts = data && data.updatedAt && data.updatedAt.toDate ? data.updatedAt.toDate() : null;
            $('updated-at').textContent = ts ? '마지막 변경: ' + ts.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '';
        }

        const cfg = Z.firebase || {};
        if (!cfg.projectId || !cfg.apiKey || !Z.adminEmail) {
            $('setup-needed').classList.remove('hidden');
            renderCurrent(null);
        } else {
            const app = initializeApp(cfg);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const ref = doc(db, 'site', 'booking');

            async function load() {
                try {
                    const snap = await getDoc(ref);
                    renderCurrent(snap.exists() ? snap.data() : null);
                } catch (e) {
                    renderCurrent(null);
                    showMessage('현황을 불러오지 못했어요. Firestore 규칙에서 읽기가 허용되어 있는지 확인해 주세요.', false);
                }
            }

            async function save(status) {
                $('set-open').disabled = $('set-closed').disabled = true;
                try {
                    await setDoc(ref, { status, month: Z.kstMonth().key, updatedAt: serverTimestamp() });
                    await load();
                    showMessage(status === 'closed' ? '이번 달 예약을 마감했어요.' : '예약 받기로 바꿨어요.', true);
                } catch (e) {
                    showMessage(e.code === 'permission-denied'
                        ? '이 계정에는 변경 권한이 없어요. Firestore 규칙에 넣은 이메일과 로그인한 계정이 같은지 확인해 주세요.'
                        : '저장하지 못했어요. 잠시 후 다시 시도해 주세요. (' + (e.code || e.message) + ')', false);
                } finally {
                    $('set-open').disabled = $('set-closed').disabled = false;
                }
            }

            $('login').addEventListener('click', async () => {
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                } catch (e) {
                    if (e.code !== 'auth/popup-closed-by-user') {
                        showMessage(e.code === 'auth/unauthorized-domain'
                            ? '이 도메인이 Firebase 승인 도메인에 없어요. Authentication > 설정 > 승인된 도메인에 추가해 주세요.'
                            : '로그인하지 못했어요. (' + e.code + ')', false);
                    }
                }
            });
            $('logout').addEventListener('click', () => signOut(auth));
            $('set-open').addEventListener('click', () => save('open'));
            $('set-closed').addEventListener('click', () => save('closed'));

            onAuthStateChanged(auth, async (user) => {
                if (user && user.email !== Z.adminEmail) {
                    showMessage(user.email + ' 계정은 관리 권한이 없어요. 관리자 계정으로 다시 로그인해 주세요.', false);
                    await signOut(auth);
                    return;
                }
                $('signed-out').classList.toggle('hidden', !!user);
                $('signed-in').classList.toggle('hidden', !user);
                $('who').textContent = user ? user.email : '';
            });

            load();
        }
    </script>
</body>
</html>
